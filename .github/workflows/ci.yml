# CI for the Project Steward skill repository itself.
#
# This repository contains no application code, so there is nothing to compile
# and nothing to unit test. What can break is structural: a template that stops
# being valid YAML, a reference to a renamed file, a version that disagrees with
# the changelog, or frontmatter that stops Claude Code discovering the skill.
#
# A skill that prescribes CI should run CI. See references/self-audit.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install --quiet pyyaml

      - name: Structural checks
        run: python scripts/check_skill.py

      - name: Script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
